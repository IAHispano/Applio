appId: org.applio.app
productName: Applio
copyright: Copyright © Applio contributors
compression: maximum
asar: false
afterPack: ./afterPack.js

directories:
  output: dist-installers

publish:
  - provider: github
    owner: IAHispano
    repo: Applio

files:
  - dist/**/*
  - package.json
  - from: ../..
    to: .
    filter:
      - core.py
      - requirements.txt
      - LICENSE
  - from: ../../rvc
    to: rvc
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: ../../assets
    to: assets
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: ../../plugins
    to: plugins
    filter:
      - "**/*"
  - from: ../../app/api/dist
    to: app/api/dist
  - from: ../../app/api/package.json
    to: app/api/package.json
  - from: ../../app/web/.next/standalone
    to: app/web/.next/standalone
  - from: ../../app/web/.next/standalone/node_modules
    to: app/web/.next/standalone/node_modules
  - from: ../../app/web/.next/static
    to: app/web/.next/standalone/.next/static
  - from: ../../app/web/public
    to: app/web/.next/standalone/public

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../../assets/ICON.ico
  signAndEditExecutable: false
  artifactName: Applio-${version}-Windows-Setup.${ext}

nsis:
  artifactName: Applio-${version}-Windows-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Applio
  uninstallDisplayName: Applio
  installerIcon: ../../assets/ICON.ico
  uninstallerIcon: ../../assets/ICON.ico
  installerHeaderIcon: ../../assets/ICON.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.music
  icon: ../../assets/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Applio-${version}-macOS-${arch}.${ext}

dmg:
  icon: ../../assets/icon.icns
  artifactName: Applio-${version}-macOS.${ext}

linux:
  category: AudioVideo
  icon: ../../assets/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Applio-${version}-Linux-${arch}.${ext}

appImage:
  artifactName: Applio-${version}-Linux.${ext}

deb:
  artifactName: Applio-${version}-Linux.${ext}
