name: Desktop installer

on:
  workflow_dispatch:
  push:
    # release tags come from assets/config_template.json version (e.g. "3.6.4")
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies
        run: npm install --workspaces --include-workspace-root
      - name: Build API + web
        run: npm run build
      - name: Build Windows installer
        working-directory: app/desktop
        run: npx electron-builder --win --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Applio-Windows-installer
          path: app/desktop/dist-installers/*.exe
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/desktop/dist-installers/*.exe
