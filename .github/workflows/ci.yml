name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test deps (CPU torch for engine probes)
        run: pip install click torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install web dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Lint + format check (Biome)
        run: npx biome check app tests

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm test
