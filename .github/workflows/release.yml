name: Build and Release

# Manual release: builds the Electron installers on all three platforms and
# publishes them as a GitHub release. Run from Actions > Build and Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 3.7.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: win
            build-command: pnpm build:win
          - os: macos-latest
            id: mac
            build-command: pnpm build:mac
          - os: ubuntu-latest
            id: linux
            build-command: pnpm build:linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-33.2.1
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y rpm
          # fpm (Ruby) is required by electron-builder for the .deb target.
          command -v fpm >/dev/null || sudo gem install fpm --no-document || echo "fpm install failed, continuing"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version to release input
        # Installer filenames embed the package.json version, so it must
        # match the release tag (leading "v" is stripped if given).
        run: node -e "const fs=require('node:fs');const v=(process.env.RELEASE_VERSION||'').replace(/^v/,'');if(!v)throw new Error('empty version');for(const f of ['package.json','app/api/package.json','app/web/package.json','app/desktop/package.json']){const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=v;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n');}const c='assets/config_template.json';const cfg=JSON.parse(fs.readFileSync(c,'utf8'));cfg.version=v;fs.writeFileSync(c,JSON.stringify(cfg,null,2)+'\n');console.log('version set to '+v);"
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}

      - name: Build app
        run: ${{ matrix.build-command }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Unsigned CI builds (no Apple Developer certificate on runners).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Compress artifacts
        working-directory: app/desktop/dist-installers
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a -tzip build-artifacts.zip Applio-*-Windows-Setup.exe *.blockmap latest.yml 2>/dev/null || true
          elif [ "$RUNNER_OS" == "macOS" ]; then
            zip -r build-artifacts.zip Applio-*-macOS*.dmg Applio-*-macOS*.zip latest-mac.yml 2>/dev/null || true
          else
            zip -r build-artifacts.zip Applio-*-Linux*.AppImage Applio-*-Linux*.deb *.blockmap latest-linux.yml 2>/dev/null || true
          fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.id }}
          path: app/desktop/dist-installers/build-artifacts.zip
          retention-days: 1
          compression-level: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit messages since last tag
        id: changelog
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          LAST_TAG=$(git describe --tags --abbrev=0 || echo "")
          echo "Last tag: $LAST_TAG"

          if [ -z "$LAST_TAG" ]; then
            LOG_RANGE="HEAD"
          else
            LOG_RANGE="$LAST_TAG..HEAD"
          fi

          COMMITS=$(git log $LOG_RANGE -n 50 --pretty=format:"- [\`%h\`]($REPO_URL/commit/%H) %s (%an)")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Extract and organize artifacts
        run: |
          mkdir -p release-files
          cd artifacts
          for dir in */; do
            if [ -f "$dir/build-artifacts.zip" ]; then
              unzip -q "$dir/build-artifacts.zip" -d "../release-files/"
            fi
          done
          cd ..
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Applio v${{ github.event.inputs.version }}
          files: release-files/**
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
